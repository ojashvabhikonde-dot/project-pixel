name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root & package dependencies
        run: |
          npm ci || npm install
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Run Backend Regression Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_for_ci_pipeline_only

      - name: Build Frontend
        run: npm run build:frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001
